[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flag2027"
version = "0.1.0"
description = "Frozen EGMA face–voice association release and reproduction tools"
requires-python = ">=3.11"

[project.scripts]
flag-egma = "flag_egma.__main__:main"

[tool.setuptools]
include-package-data = false
package-dir = {flag_egma = "src"}
packages = [
    "flag_egma",
    "flag_egma.association",
    "flag_egma.backbone",
    "flag_egma.backbone._facenet",
    "flag_egma.backbone._facenet.utils",
    "flag_egma.baseline",
    "flag_egma.graph",
]

[tool.setuptools.package-data]
"flag_egma.backbone._facenet" = ["LICENSE.md"]

